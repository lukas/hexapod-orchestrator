# `pythonpath` keeps the suite self-sufficient on every runtime (Mac venv,
# controller system Python with UV_NO_PROJECT=1, fresh clones):
#   .             the `orchestrator` and `metaagent` packages
#   orchestrator  bare-module imports the scripts use among themselves
#                 (`import state_dir`, `from launch_run import ...`)
[pytest]
markers =
    slow: takes more than ~5 s; excluded from the default loop with -m "not slow"
pythonpath = . orchestrator
testpaths = tests
