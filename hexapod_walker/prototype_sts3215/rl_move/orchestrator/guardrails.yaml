# Hard limits for the autonomous experiment orchestrator.
# The decision agent must read this file every cycle and stay within it.

compute:
  pods: [hexapod-sweep-friction, hexapod-sweep-s3, hexapod-sweep-s4,
         hexapod-sweep-s5, hexapod-sweep-s6,
         hexapod-sweep-long5m, hexapod-sweep-lower, hexapod-sweep-walk]
  # s5/s6 added 08-08 evening (operator): third node g12ba48 was sitting
  # idle. Both are 56-core-limit pods like s3/s4.
  # CORRECTED 2026-08-08 (operator): `nproc` lies — it shows the 128-core
  # host, but cgroup CPU LIMITS cap each pod. Actual limits:
  #   s3 / s4 / long5m / walk: 56 cores   friction / lower: 30 cores
  # One 48-env run wants ~50-60 cores. Measured fps consequences:
  #   56-core pod, 1 run  -> ~1090 fps      (full speed)
  #   56-core pod, 2 runs -> ~240 fps each  (~4.5x slower, NOT ~half)
  #   30-core pod, 1 run  -> ~110 fps
  #   30-core pod, 2 runs -> ~75 fps each   (5M steps ~= 18 h; avoid)
  # Placement rules: ONE experiment per pod is the norm. friction/lower
  # are for smoke tests, harness evals, and short diagnostics — put a
  # full-budget experiment there only if nothing else is free and note
  # the fps cost in the ledger. Doubling up on a 56-core pod is allowed
  # only for cheap (<=1M step) diagnostics. When runs land somewhere
  # slow, rebalancing (kill + relaunch from its own last checkpoint on a
  # freed big pod) is allowed and should be logged.
  max_runs_per_pod: 2
  # NODE TOPOLOGY (operator, 08-08 evening): the pods sit on THREE
  # ~128-core physical nodes (g142d86: friction/long5m/s3; g129004:
  # lower/s4/walk; g12ba48: s5/s6) and the kernel schedules host-wide —
  # pod cgroup limits do NOT protect you from a busy neighbor pod.
  # Running 8 experiments "within pod limits" starved every one of
  # them 4-5x, made them all finish in a clump, and idled the fleet
  # during the verdict cycle. The launcher reads live pod->node
  # placement and REFUSES a non-smoke launch when the target node
  # already hosts max_heavy_per_node trainers. Do not bypass with
  # --allow-slow unless the ledger records why.
  max_heavy_per_node: 2
  # 2 heavy per node x 3 nodes = the real experiment budget. Smokes
  # (<=1M steps, W&B-disabled) don't count against it.
  max_concurrent_runs: 6
  # HOST-LOAD GATE (operator, 08-08 evening): the nodes are SHARED with
  # other projects (e.g. mujoco-jax tests) and machines spin up/down.
  # Trainer counts only see our runs, so the launcher additionally reads
  # /proc/loadavg (host-wide, all tenants) from the target pod and
  # refuses a full run when fewer than ~55 host cores are actually free
  # (smokes need ~8). An unreachable pod is a clean REFUSED, never a
  # crash. A refusal for resources is normal traffic: pick another pod,
  # wait, or leave the slot idle — do not reach for --allow-slow to
  # outbid another tenant.
  reserved_smoke_slots: 2
  max_steps_per_run: 6000000
  max_decision_cycles_per_day: 12  # watcher enforces; agent should not try to exceed
  # Cycles are event-driven and CONCURRENT (08-08 evening): when a run
  # finishes while another cycle is still working, the watcher spawns a
  # second cycle immediately instead of queuing. Coordination is
  # mechanical (launcher lock, ledger lock, snapshot.sh git lock); a
  # cycle must never evaluate/verdict/launch for runs its prompt lists
  # as belonging to a concurrent cycle.
  max_concurrent_cycles: 2
  # Blast-radius cap (external review 8e): one confused cycle must not be
  # able to burn a weekend of pods. Hard per-cycle ceilings:
  max_new_launches_per_cycle: 4
  max_new_steps_per_cycle: 16000000
  n_envs: 48        # per run; do not raise while pods host two runs
  # Periodic eval/video block ALL rollout workers (single-threaded). The old
  # 20k/25k defaults cost ~65% of wall clock. Never launch below these:
  min_eval_every: 200000
  min_video_every: 200000
  # Two runs per pod means /tmp/train.log collides: each run MUST log to its
  # own file, /tmp/train_<run-name>.log.
  log_file_pattern: /tmp/train_<run-name>.log

experiments:
  # Continue-while-improving lineages (operator directive 0-a, 08-09):
  # when a run whose name starts with one of these prefixes finishes with
  # reward still climbing (last quarter beats the prior quarter), the
  # WATCHER relaunches the next segment mechanically — identical config,
  # init-from the finished checkpoint, -cN name — through the normal
  # launcher (capacity checks, ledger, verification all apply). The
  # trailing verdict cycle reviews the finished segment and must KILL the
  # continuation if frames show pathology or the trend is flat. This
  # exists because a pod idling 15-25 min through a deliberation cycle
  # after every ~20-min segment wasted a third of the fleet's time.
  auto_continue_lineages:
    - cw-walk-step0
  # Structured ledger (external review 8b): software-owned facts per run in
  # rl_move/orchestrator/experiments.json — hypothesis+predictions, parent,
  # git SHA, seed, gate, status (INTENT/RUNNING/FINISHED/FAILED), W&B ID,
  # launch-verification results, checkpoint checksum, verdict. RL_LOG.md is
  # narrative on top; the ledger is the record. Dedupe keys on the ledger.
  ledger: rl_move/orchestrator/experiments.json
  # Two-phase launch (external review 8a): write INTENT before launching;
  # mark RUNNING only after mechanically verifying process + advancing log
  # + W&B run/config + no duplicate + pod code at snapshot SHA. The agent
  # is never authoritative about operational state.
  require_mechanical_launch_verification: true
  # ALL training launches (experiments AND smokes) go through
  # rl_move/orchestrator/launch_run.py, which enforces live capacity
  # checks, duplicate/concurrency gates, the ledger, and post-launch
  # verification. Raw `kubectl exec ... nohup train_ppo_sim.py` is a
  # guardrail violation. Use `launch_run.py status` before placing runs.
  require_launcher: true
  # Warm-start from an existing champion unless the log records a reason
  # a fresh init is the hypothesis being tested.
  require_warm_start_default: true
  # Every run needs, in its W&B notes AND the ledger entry: falsifiable
  # hypothesis (prediction-if-true, prediction-if-false, strongest
  # alternative), parent checkpoint, exact gate, code commit. Experiments
  # whose rationale is "try another coefficient" are forbidden (review §0).
  require_hypothesis_and_gate: true
  require_falsifiable_predictions: true
  # Post-launch checkup (operator directive 2026-08-08): ~5 min after every
  # launch, `launch_run.py checkup --run <name>` re-verifies the run.
  # OWNED BY THE WATCHER since 08-08 evening: watch_loop.py runs it
  # asynchronously for every verified launch; DEAD/SUSPECT findings trigger
  # the next cycle and are injected into its prompt. The agent must NOT
  # sleep out the 5 minutes inside a cycle (that serialized every launch
  # into +5 min of wall clock) — verify the launch (two-phase) and exit;
  # act on injected findings FIRST in the cycle that receives them (DEAD ->
  # retry once then escalate; SUSPECT -> read log, kill/rebalance/fix).
  require_post_launch_checkup: true
  checkup_owner: watcher
  checkup_after_s: 300
  # Progress claims must cite metric + named baseline + delta + noise scale.
  # Deltas inside the calibrated eval-noise band are "no evidence of
  # change". Unbacked improvement language is a guardrail violation.
  progress_claims_require_baseline_delta: true
  # One variable per run wherever possible; twins only with distinct seeds
  # (the model.seed overwrite fix must stay in place).
  one_variable_per_run: true
  # Champions are append-only: never overwrite ppo_goal_<name>.zip of a
  # previous run; new runs get new names.
  never_overwrite_checkpoints: true

evaluation:
  # Decisions must be based on the exact-path harness, not W&B curves.
  harness: rl_move/sim/eval_checkpoint.py
  episodes_per_mode: 6
  passes: [deterministic, stochastic]
  eval_at_own_dr: true
  # Videos are mandatory: visually inspect a frame strip for EVERY mode
  # whose scalar appears in a verdict — passing modes especially (exploits
  # hide in passes; a flagged leg shipped inside a 12/12 lower on
  # 2026-08-08). An unwatched success is recorded "N/6 (unwatched)" and
  # cannot support a PASS. RL_LOG.md entries must describe the motion.
  require_video_review: true
  watched_modes: all_verdict_modes
  # Root-cause chain (behavior <- incentive <- pricing <- sim/objective
  # defect) is required in the log before any reward/coefficient change;
  # reward patches are last resort with stated justification.
  require_root_cause_chain: true
  # Operator directive 2026-08-08: log entries were too positive about
  # visibly broken motion. Video verdicts must lead with pathologies
  # (flag legs, tripods, dragging, jitter, lurching) and include an
  # explicit "hardware-ready: yes/no" judgment. Scalar gates NEVER
  # override a bad video. Optimistic gloss is a guardrail violation.
  video_verdict_blunt: true
  # Verdict format (external review 8c): OBSERVATIONS (mechanical facts +
  # video checksum/frame count actually reviewed) / INTERPRETATION /
  # VERDICT (PASS|FAIL|INCONCLUSIVE + hardware-ready yes|no) /
  # HYPOTHESIS STATUS (SUPPORTED|REFUTED|INCONCLUSIVE).
  verdict_format_structured: true
  require_video_provenance: true
  # Gait validity (external review 5b): a walking checkpoint is INVALID if
  # any leg is persistently sacrificed, regardless of velocity error.
  # Flag-leg detection is a permanent eval gate independent of reward terms.
  gait_validity_gate: true

plan:
  # Each cycle reviews RL_PLAN.md against the big goal (fluid real-world
  # motion on the physical hexapod, walking). Revisions allowed, but the
  # plan must not grow: keep it the same length or shorter, archive dead
  # material instead of appending.
  file: RL_PLAN.md
  may_revise: true
  must_not_grow: true

forbidden:
  - >-
    Any contact with the physical robot: no HTTP to 192.168.4.44 /
    hexapod.local, no SSH to the robot, no deploys to linux_control,
    no firmware changes.
  - >-
    Creating, resizing, or deleting pods; the eight pods above are the world.
  - >-
    Launching training with raw kubectl/nohup instead of
    orchestrator/launch_run.py.
  - >-
    Changing reward/env code without recording the diff rationale in the
    experiment log (code changes ARE allowed - that is the point - but must
    be explained and are snapshotted by tag).
  - >-
    Deleting W&B runs, checkpoints, or git history.
  - >-
    Disabling the PAUSE kill switch, the watcher, or these guardrails.

escalation:
  # If any of these happen, do NOT launch new runs; write the situation to
  # EXPERIMENT_LOG.md under "## NEEDS OPERATOR" and exit the cycle:
  - >-
    Two consecutive cycles where every launched run failed its gate badly
    (no metric moved toward its gate).
  - >-
    Any sign of infra failure (pod unreachable, W&B auth failing, git push
    rejected).
  - >-
    The next logical step requires hardware, more compute, or a plan change
    beyond RL_PLAN.md.
