# Hard limits for the autonomous experiment orchestrator.
# The decision agent must read this file every cycle and stay within it.

compute:
  # ONE POOL (operator, 2026-08-09): all 4 nodes / 32 H200s belong to this
  # project. Capacity truth lives in CAPACITY.md — do not re-derive it.
  # The 7 relic CPU sweep pods were backed up (controller:
  # /workspace/relic_backup/) and DELETED on 08-09 to free ~120 cores/node
  # for GPU train pods. Only the controller remains on the CPU side.
  pods: [hexapod-sweep-friction]
  # GPU SWITCH-OVER COMPLETE (operator, 2026-08-09): ALL training runs
  # (every non-smoke launch) run on the GPU-MJX pods below via
  # train_ppo_mjx — the launcher REFUSES CPU training launches. The CPU
  # pods above remain ONLY for: the controller (friction), eval
  # harness/video work, and W&B-disabled smokes. Feature parity with the
  # CPU trainer is closed: per-world MODEL-field DR (mass/geometry/
  # friction/compliance/gravity/gains), fixed-seed canary probes +
  # regression auto-stop, eval/video logging, and episode desync are all
  # live in the MJX stack (MJX_PORT.md). Validated by pilots
  # mjx-walk-lowent-dr03 (champion + DR 0.3: gait 6/6, PASS),
  # mjx-evalvid-check (evals/videos/desync) and mjx-dr-canary-check2
  # (model DR + canary baseline/auto-stop, 2026-08-09). Measured cost of
  # full model DR under Warp: ~25% fps; DR-off parity with the pre-DR
  # stack.
  # 12 pods, 4 per LIVE node. train-12..15 removed 08-09: node g12ba48
  # was cordoned by CoreWeave (replacement g131eec absorbed pods 0-3);
  # each node's 128 cores fit exactly 4x 24-core train pods, so the 4
  # orphans had NOWHERE to schedule (Pending 3h+). When a 4th node
  # appears: re-add them here, repoint their nodeSelector in
  # coreweave_pods_mjx_scaleout.yaml, apply, bootstrap_train_pod.sh.
  gpu_pods: [hexapod-mjx-train-0, hexapod-mjx-train-1,
             hexapod-mjx-train-2, hexapod-mjx-train-3,
             hexapod-mjx-train-4, hexapod-mjx-train-5,
             hexapod-mjx-train-6, hexapod-mjx-train-7,
             hexapod-mjx-train-8, hexapod-mjx-train-9,
             hexapod-mjx-train-10, hexapod-mjx-train-11]
  gpu:
    # pods x (1 H200 + 24-26-core cgroup), 4 per live node (operator:
    # ONE POOL, >=4 slots/machine; scale-out
    # coreweave_pods_mjx_scaleout.yaml). LIVE truth: capacity.py.
    # Exactly ONE run per GPU pod — the GPU is the unit.
    # A pod Pending on a CoreWeave hpc-verification health check is
    # normal; the launcher's live checks skip unreachable pods.
    runs_per_pod: 1
    n_envs: 4096
    host_workers: 24
    impl: warp
    # GPU steps are ~18x cheaper in wall clock: 30M steps ~= 27 min.
    # Budget cap is per run; the per-cycle caps below still apply.
    max_steps_per_run: 40000000
    # At ~20k fps the CPU-pod eval cadence would fire every 10 s; the MJX
    # trainer's eval is skip-if-busy in a background thread, but keep it
    # sane. Never launch below these on a GPU pod:
    min_eval_every: 1000000
    min_video_every: 2000000
    # 4-way vs 8-way split (operator-approved re-slicing): DEFAULT is the
    # 4-way split (4 pods x 1 GPU + 26 cores = max speed per experiment).
    # If queued INTENT experiments exceed free GPU pods for a full cycle,
    # the agent MAY re-slice to 8-way: 8 pods x 1 GPU + 12 cores
    # (requests: cpu 12, limits 14, memory 24Gi; --host-workers 10;
    # ~30-35k fps/run at 4096 envs). Procedure: only IDLE mjx-train pods
    # may be deleted/recreated, using rl_move/sim/coreweave_pod_mjx_train.yaml
    # with the name + cpu/memory fields sed-swapped; update gpu_pods here
    # in the same commit. Re-slice back to 4-way when the queue drains.
    allow_8way_split: true
  # s5/s6 added 08-08 evening (operator): third node g12ba48 was sitting
  # idle. Both are 56-core-limit pods like s3/s4.
  # CORRECTED 2026-08-08 (operator): `nproc` lies — it shows the 128-core
  # host, but cgroup CPU LIMITS cap each pod. Actual limits:
  #   s3 / s4 / long5m / walk: 56 cores   friction / lower: 30 cores
  # One 48-env run wants ~50-60 cores. Measured fps consequences:
  #   56-core pod, 1 run  -> ~1090 fps      (full speed)
  #   56-core pod, 2 runs -> ~240 fps each  (~4.5x slower, NOT ~half)
  #   30-core pod, 1 run  -> ~110 fps
  #   30-core pod, 2 runs -> ~75 fps each   (5M steps ~= 18 h; avoid)
  # Placement rules: ONE experiment per pod is the norm. friction/lower
  # are for smoke tests, harness evals, and short diagnostics — put a
  # full-budget experiment there only if nothing else is free and note
  # the fps cost in the ledger. Doubling up on a 56-core pod is allowed
  # only for cheap (<=1M step) diagnostics. When runs land somewhere
  # slow, rebalancing (kill + relaunch from its own last checkpoint on a
  # freed big pod) is allowed and should be logged.
  max_runs_per_pod: 2
  # NODE TOPOLOGY (operator, 08-08 evening): the pods sit on THREE
  # ~128-core physical nodes (g142d86: friction/long5m/s3; g129004:
  # lower/s4/walk; g12ba48: s5/s6) and the kernel schedules host-wide —
  # pod cgroup limits do NOT protect you from a busy neighbor pod.
  # Running 8 experiments "within pod limits" starved every one of
  # them 4-5x, made them all finish in a clump, and idled the fleet
  # during the verdict cycle. The launcher reads live pod->node
  # placement and REFUSES a non-smoke launch when the target node
  # already hosts max_heavy_per_node trainers. Do not bypass with
  # --allow-slow unless the ledger records why.
  max_heavy_per_node: 2
  # Since the 2026-08-09 switch-over the experiment budget is the GPU
  # pod count (one run per GPU pod; 16 after the one-pool scale-out).
  # The CPU node math above applies only to smokes/evals now.
  max_concurrent_runs: 16
  # HOST-LOAD GATE (operator, 08-08 evening): the nodes are SHARED with
  # other projects (e.g. mujoco-jax tests) and machines spin up/down.
  # Trainer counts only see our runs, so the launcher additionally reads
  # /proc/loadavg (host-wide, all tenants) from the target pod and
  # refuses a full run when fewer than ~55 host cores are actually free
  # (smokes need ~8). An unreachable pod is a clean REFUSED, never a
  # crash. A refusal for resources is normal traffic: pick another pod,
  # wait, or leave the slot idle — do not reach for --allow-slow to
  # outbid another tenant.
  reserved_smoke_slots: 2
  max_steps_per_run: 6000000
  # Raised 12 -> 48 (operator, 2026-08-09 morning): at GPU speeds a run
  # finishes every ~25-40 min; 12 cycles/day was sized for the CPU era
  # and would idle the fleet for hours. Keep in sync with watch_loop.py.
  max_decision_cycles_per_day: 96  # watcher enforces; agent should not try to exceed (operator doubled 08-10 morning)
  # Cycles are event-driven and CONCURRENT (08-08 evening): when a run
  # finishes while another cycle is still working, the watcher spawns a
  # second cycle immediately instead of queuing. Coordination is
  # mechanical (launcher lock, ledger lock, snapshot.sh git lock); a
  # cycle must never evaluate/verdict/launch for runs its prompt lists
  # as belonging to a concurrent cycle.
  # Raised 2 -> 4 (operator, 08-09 ~10:3x): 12 GPU runs finishing in the
  # same half hour left 14 GPUs idle behind a 2-cycle triage bottleneck.
  # Keep in sync with watch_loop.py.
  max_concurrent_cycles: 4
  # Model tiering (operator cost order, 08-09 evening: ~$23/cycle all-
  # fable was too expensive). Triage = sonnet; dig-in escalations,
  # checkup-findings and idle-kick cycles = fable. A triage cycle that
  # hits a dig-in trigger leaves the run unverdicted and prints
  # "DIG-IN: <run> — why"; the watcher re-spawns it on the deep model.
  # Keep in sync with watch_loop.py AGENT_MODEL_*.
  agent_model_triage: claude-sonnet-5
  agent_model_deep: claude-fable-5
  # Blast-radius cap (external review 8e): one confused cycle must not be
  # able to burn a weekend of pods. Hard per-cycle ceilings:
  #
  # OPERATOR HOLD (08-10 morning): TRIAGE/VERDICT ONLY until the operator
  # clears it. Analyze every finished run (evals, videos, verdicts, SKILLS,
  # runs docs, RL_LOG lines) but launch NOTHING — no refills, no seed
  # twins, no respec/backlog adds, no retries. The launcher mechanically
  # refuses while rl_move/orchestrator/LAUNCH_HOLD exists; do not fight
  # REFUSED launches, and note skipped refills as
  # "HARD reason: operator launch hold". Idle pods are EXPECTED today.
  max_new_launches_per_cycle: 4  # restored 08-10 ~15:0x UTC: LAUNCH_HOLD file cleared (operator lifted the morning hold); was 0 during the hold
  # CPU-stack steps (smokes on sweep pods). GPU steps are ~18x cheaper
  # in wall clock and have their own cycle cap below — do NOT count GPU
  # launches against this number (operator, 2026-08-09, resolving the
  # 40M-per-run vs 16M-per-cycle conflict cycle 24 flagged).
  max_new_steps_per_cycle: 16000000
  max_new_gpu_steps_per_cycle: 80000000
  n_envs: 48        # per run; do not raise while pods host two runs
  # Periodic eval/video block ALL rollout workers (single-threaded). The old
  # 20k/25k defaults cost ~65% of wall clock. Never launch below these:
  min_eval_every: 200000
  min_video_every: 200000
  # Two runs per pod means /tmp/train.log collides: each run MUST log to its
  # own file, /tmp/train_<run-name>.log.
  log_file_pattern: /tmp/train_<run-name>.log

experiments:
  # Continue-while-improving lineages (operator directive 0-a, 08-09):
  # when a run whose name starts with one of these prefixes finishes with
  # reward still climbing (last quarter beats the prior quarter), the
  # WATCHER relaunches the next segment mechanically — identical config,
  # init-from the finished checkpoint, -cN name — through the normal
  # launcher (capacity checks, ledger, verification all apply). The
  # trailing verdict cycle reviews the finished segment and must KILL the
  # continuation if frames show pathology or the trend is flat. This
  # exists because a pod idling 15-25 min through a deliberation cycle
  # after every ~20-min segment wasted a third of the fleet's time.
  auto_continue_lineages:
    - cw-walk-step0
  # Structured ledger (external review 8b): software-owned facts per run in
  # rl_move/orchestrator/experiments.json — hypothesis+predictions, parent,
  # git SHA, seed, gate, status (INTENT/RUNNING/FINISHED/FAILED), W&B ID,
  # launch-verification results, checkpoint checksum, verdict. RL_LOG.md is
  # narrative on top; the ledger is the record. Dedupe keys on the ledger.
  ledger: rl_move/orchestrator/experiments.json
  # Two-phase launch (external review 8a): write INTENT before launching;
  # mark RUNNING only after mechanically verifying process + advancing log
  # + W&B run/config + no duplicate + pod code at snapshot SHA. The agent
  # is never authoritative about operational state.
  require_mechanical_launch_verification: true
  # ALL training launches (experiments AND smokes) go through
  # rl_move/orchestrator/launch_run.py, which enforces live capacity
  # checks, duplicate/concurrency gates, the ledger, and post-launch
  # verification. Raw `kubectl exec ... nohup train_ppo_sim.py` is a
  # guardrail violation. Use `launch_run.py status` before placing runs.
  require_launcher: true
  # Warm-start from an existing champion unless the log records a reason
  # a fresh init is the hypothesis being tested.
  require_warm_start_default: true
  # Every run needs, in its W&B notes AND the ledger entry: falsifiable
  # hypothesis (prediction-if-true, prediction-if-false, strongest
  # alternative), parent checkpoint, exact gate, code commit. Experiments
  # whose rationale is "try another coefficient" are forbidden (review §0).
  require_hypothesis_and_gate: true
  require_falsifiable_predictions: true
  # Post-launch checkup (operator directive 2026-08-08): ~5 min after every
  # launch, `launch_run.py checkup --run <name>` re-verifies the run.
  # OWNED BY THE WATCHER since 08-08 evening: watch_loop.py runs it
  # asynchronously for every verified launch; DEAD/SUSPECT findings trigger
  # the next cycle and are injected into its prompt. The agent must NOT
  # sleep out the 5 minutes inside a cycle (that serialized every launch
  # into +5 min of wall clock) — verify the launch (two-phase) and exit;
  # act on injected findings FIRST in the cycle that receives them (DEAD ->
  # retry once then escalate; SUSPECT -> read log, kill/rebalance/fix).
  require_post_launch_checkup: true
  checkup_owner: watcher
  checkup_after_s: 300
  # Progress claims must cite metric + named baseline + delta + noise scale.
  # Deltas inside the calibrated eval-noise band are "no evidence of
  # change". Unbacked improvement language is a guardrail violation.
  progress_claims_require_baseline_delta: true
  # One variable per run wherever possible; twins only with distinct seeds
  # (the model.seed overwrite fix must stay in place).
  one_variable_per_run: true
  # Champions are append-only: never overwrite ppo_goal_<name>.zip of a
  # previous run; new runs get new names.
  never_overwrite_checkpoints: true

evaluation:
  # Decisions must be based on the exact-path harness, not W&B curves.
  harness: rl_move/sim/eval_checkpoint.py
  episodes_per_mode: 6
  passes: [deterministic, stochastic]
  eval_at_own_dr: true
  # TRIAGE-FIRST (operator, 2026-08-09: "lightweight review unless
  # there's something real to dig into"). Every verdict still requires
  # eyes on the GATED mode's det frame strip/video — an unwatched
  # success is unverified and cannot support a PASS (a flagged leg
  # shipped inside a 12/12 lower on 2026-08-08). But all-mode det+sto
  # strip review, provenance checksums, and the structured verdict
  # essay apply only on a DIG-IN trigger: gate/video disagreement,
  # metrics anomalous beyond eval noise, protected-skill erosion,
  # canary auto-stop, plan-fork decisions, or reward/env code changes.
  require_video_review: true
  watched_modes: gated_mode_det  # all_verdict_modes on dig-in
  # Root-cause chain (behavior <- incentive <- pricing <- sim/objective
  # defect) is required in the log before any reward/coefficient change;
  # reward patches are last resort with stated justification.
  require_root_cause_chain: true
  # Operator directive 2026-08-08: log entries were too positive about
  # visibly broken motion. Video verdicts must lead with pathologies
  # (flag legs, tripods, dragging, jitter, lurching) and include an
  # explicit "hardware-ready: yes/no" judgment. Scalar gates NEVER
  # override a bad video. Optimistic gloss is a guardrail violation.
  video_verdict_blunt: true
  # Verdict format (external review 8c) — DIG-IN ONLY since 08-09:
  # OBSERVATIONS / INTERPRETATION / VERDICT (+ hardware-ready) /
  # HYPOTHESIS STATUS. Clear pass/fail gets: ledger one-liner via
  # launch_run.py update, 1-2 RL_LOG lines, and a human OUTCOME
  # paragraph appended to the run's W&B notes (ops.sh wandbnote).
  verdict_format_structured: dig_in_only
  require_video_provenance: dig_in_only
  # Every finished run's W&B notes must END with the OUTCOME paragraph:
  # what happened + what was learned, plain English for a human.
  require_wandb_outcome_note: true
  # Gait validity (external review 5b): a walking checkpoint is INVALID if
  # any leg is persistently sacrificed, regardless of velocity error.
  # Flag-leg detection is a permanent eval gate independent of reward terms.
  gait_validity_gate: true

plan:
  # Each cycle reviews RL_PLAN.md against the big goal (fluid real-world
  # motion on the physical hexapod, walking). Revisions allowed, but the
  # plan must not grow: keep it the same length or shorter, archive dead
  # material instead of appending.
  file: RL_PLAN.md
  may_revise: true
  must_not_grow: true

forbidden:
  - >-
    Any contact with the physical robot: no HTTP to 192.168.4.44 /
    hexapod.local, no SSH to the robot, no deploys to linux_control,
    no firmware changes.
  - >-
    Creating, resizing, or deleting pods — EXCEPT the hexapod-mjx-train-N
    pods, which may be deleted/recreated ONLY while idle and ONLY via the
    documented re-slice/scale-out manifests (compute.gpu above,
    CAPACITY.md). The controller (hexapod-sweep-friction) is never
    touched. (The other sweep pods were retired+deleted 2026-08-09.)
  - >-
    Launching training with raw kubectl/nohup instead of
    orchestrator/launch_run.py.
  - >-
    Changing reward/env code without recording the diff rationale in the
    experiment log (code changes ARE allowed - that is the point - but must
    be explained and are snapshotted by tag).
  - >-
    Deleting W&B runs, checkpoints, or git history.
  - >-
    Disabling the PAUSE kill switch, the watcher, or these guardrails.

# OPERATOR DIRECTIVE 2026-08-09 (throughput — binding): the fleet idled a
# whole night on questions the campaign could have answered itself. Idle
# GPU pods are the failure mode, not the safe default.
operator_unblock_policy:
  # (1) ASSUME AND KEEP GOING. A design/gate/reward question that would
  # previously park a line under "NEEDS OPERATOR" no longer stops work
  # when a well-reasoned recommendation exists (from the rulings doc,
  # the binding reviews, or the cycle's own root-cause analysis).
  # Adopt the recommendation, record in RL_LOG under
  # "## ASSUMPTION (operator to review)": the question, the assumption
  # adopted, the evidence for it, and what to revisit if overruled.
  # Then launch. Wrong-but-recorded beats idle.
  assume_and_go: true
  # (2) TRULY OPERATOR-ONLY blockers (hardware access/calibration,
  # physical robot, spend approvals) still block THAT line — but idle
  # pods must then pick up parallel lines. Authorized now (operator,
  # 2026-08-09), each with its own lineage, gates, and pre-registration:
  #   - command-steering: velocity-command competence / "drive it
  #     around" arms — forward + forward-diagonal for promotion per the
  #     rulings; wider hemisphere allowed as exploratory (non-promotion)
  #     arms
  #   - quadruped-mode: stand/walk on four rear legs (party-tricks
  #     sketch): static stance -> weight-shift under DR -> quadruped
  #     walk. Pulled FORWARD from "after Done" by the operator: allowed
  #     whenever main-line arms cannot fill the GPU pods
  #   - mirror-symmetry implementation cycle; contact-from-
  #     proprioception aux head
  parallel_lines_when_blocked: [command-steering, quadruped-mode,
                                mirror-symmetry, contact-aux-head]
  # The full operator backlog lives in rl_docs/WISHLIST.md (operator-
  # owned). Free pods pull the topmost [READY] item not already
  # running; [CODE] items get a dedicated implementation cycle when
  # 2+ pods would otherwise idle.
  wishlist: rl_docs/WISHLIST.md
  # A GPU pod left idle through a full cycle without a ledger-recorded
  # HARD reason (capacity caps, verification failure, launcher REFUSED)
  # is a guardrail violation. "Waiting on the operator" alone is no
  # longer a valid idle reason — apply (1) or (2).
  idle_gpu_needs_hard_reason: true

escalation:
  # If any of these happen, do NOT launch new runs; write the situation to
  # EXPERIMENT_LOG.md under "## NEEDS OPERATOR" and exit the cycle.
  # EXCEPTION (operator, 2026-08-09): design questions covered by
  # operator_unblock_policy.assume_and_go are NOT escalations — adopt the
  # recommendation, record the assumption, keep going:
  - >-
    Two consecutive cycles where every launched run failed its gate badly
    (no metric moved toward its gate).
  - >-
    Any sign of infra failure (pod unreachable, W&B auth failing, git push
    rejected).
  - >-
    The next logical step requires hardware, more compute, or a plan change
    beyond RL_PLAN.md.
