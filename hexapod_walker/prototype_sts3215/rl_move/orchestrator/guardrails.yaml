# Hard limits for the autonomous experiment orchestrator.
# The decision agent must read this file every cycle and stay within it.

compute:
  pods: [hexapod-sweep-friction, hexapod-sweep-s3, hexapod-sweep-s4,
         hexapod-sweep-long5m, hexapod-sweep-lower, hexapod-sweep-walk]
  # Each pod has 128 cores; one 48-env run saturates its learner around
  # ~50-60 cores (measured 2026-08-08: 48 envs 3.6k fps, 96 envs 4.8k fps,
  # 120 envs flat). Two 48-env runs per pod run at near-full speed each.
  max_runs_per_pod: 2
  # 6 pods x 2 = 12 slots; cap experiments at 10 so ~2 slots are always
  # free for YOUR OWN smoke tests, harness evals, and code validation.
  # Smokes: WANDB_MODE=disabled (or non-cw run names), short, kill when done.
  max_concurrent_runs: 10
  reserved_smoke_slots: 2
  max_steps_per_run: 6000000
  max_decision_cycles_per_day: 12  # watcher enforces; agent should not try to exceed
  # Blast-radius cap (external review 8e): one confused cycle must not be
  # able to burn a weekend of pods. Hard per-cycle ceilings:
  max_new_launches_per_cycle: 4
  max_new_steps_per_cycle: 16000000
  n_envs: 48        # per run; do not raise while pods host two runs
  # Periodic eval/video block ALL rollout workers (single-threaded). The old
  # 20k/25k defaults cost ~65% of wall clock. Never launch below these:
  min_eval_every: 200000
  min_video_every: 200000
  # Two runs per pod means /tmp/train.log collides: each run MUST log to its
  # own file, /tmp/train_<run-name>.log.
  log_file_pattern: /tmp/train_<run-name>.log

experiments:
  # Structured ledger (external review 8b): software-owned facts per run in
  # rl_move/orchestrator/experiments.json — hypothesis+predictions, parent,
  # git SHA, seed, gate, status (INTENT/RUNNING/FINISHED/FAILED), W&B ID,
  # launch-verification results, checkpoint checksum, verdict. RL_LOG.md is
  # narrative on top; the ledger is the record. Dedupe keys on the ledger.
  ledger: rl_move/orchestrator/experiments.json
  # Two-phase launch (external review 8a): write INTENT before launching;
  # mark RUNNING only after mechanically verifying process + advancing log
  # + W&B run/config + no duplicate + pod code at snapshot SHA. The agent
  # is never authoritative about operational state.
  require_mechanical_launch_verification: true
  # Warm-start from an existing champion unless the log records a reason
  # a fresh init is the hypothesis being tested.
  require_warm_start_default: true
  # Every run needs, in its W&B notes AND the ledger entry: falsifiable
  # hypothesis (prediction-if-true, prediction-if-false, strongest
  # alternative), parent checkpoint, exact gate, code commit. Experiments
  # whose rationale is "try another coefficient" are forbidden (review §0).
  require_hypothesis_and_gate: true
  require_falsifiable_predictions: true
  # One variable per run wherever possible; twins only with distinct seeds
  # (the model.seed overwrite fix must stay in place).
  one_variable_per_run: true
  # Champions are append-only: never overwrite ppo_goal_<name>.zip of a
  # previous run; new runs get new names.
  never_overwrite_checkpoints: true

evaluation:
  # Decisions must be based on the exact-path harness, not W&B curves.
  harness: rl_move/sim/eval_checkpoint.py
  episodes_per_mode: 6
  passes: [deterministic, stochastic]
  eval_at_own_dr: true
  # Videos are mandatory: render eval videos and visually inspect the PNG
  # frame strips for at least walk + rise before any verdict or launch.
  # RL_LOG.md entries must describe what the motion looked like.
  require_video_review: true
  # Operator directive 2026-08-08: log entries were too positive about
  # visibly broken motion. Video verdicts must lead with pathologies
  # (flag legs, tripods, dragging, jitter, lurching) and include an
  # explicit "hardware-ready: yes/no" judgment. Scalar gates NEVER
  # override a bad video. Optimistic gloss is a guardrail violation.
  video_verdict_blunt: true
  # Verdict format (external review 8c): OBSERVATIONS (mechanical facts +
  # video checksum/frame count actually reviewed) / INTERPRETATION /
  # VERDICT (PASS|FAIL|INCONCLUSIVE + hardware-ready yes|no) /
  # HYPOTHESIS STATUS (SUPPORTED|REFUTED|INCONCLUSIVE).
  verdict_format_structured: true
  require_video_provenance: true
  # Gait validity (external review 5b): a walking checkpoint is INVALID if
  # any leg is persistently sacrificed, regardless of velocity error.
  # Flag-leg detection is a permanent eval gate independent of reward terms.
  gait_validity_gate: true

plan:
  # Each cycle reviews RL_PLAN.md against the big goal (fluid real-world
  # motion on the physical hexapod, walking). Revisions allowed, but the
  # plan must not grow: keep it the same length or shorter, archive dead
  # material instead of appending.
  file: RL_PLAN.md
  may_revise: true
  must_not_grow: true

forbidden:
  - Any contact with the physical robot: no HTTP to 192.168.4.44 / hexapod.local,
    no SSH to the robot, no deploys to linux_control, no firmware changes.
  - Creating, resizing, or deleting pods; the six pods above are the world.
  - Changing reward/env code without recording the diff rationale in the
    experiment log (code changes ARE allowed - that is the point - but must
    be explained and are snapshotted by tag).
  - Deleting W&B runs, checkpoints, or git history.
  - Disabling the PAUSE kill switch, the watcher, or these guardrails.

escalation:
  # If any of these happen, do NOT launch new runs; write the situation to
  # EXPERIMENT_LOG.md under "## NEEDS OPERATOR" and exit the cycle:
  - Two consecutive cycles where every launched run failed its gate badly
    (no metric moved toward its gate).
  - Any sign of infra failure (pod unreachable, W&B auth failing, git push
    rejected).
  - The next logical step requires hardware, more compute, or a plan change
    beyond RL_PLAN.md.
