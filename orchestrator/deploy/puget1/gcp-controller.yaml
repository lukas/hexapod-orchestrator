apiVersion: apps/v1
kind: Deployment
metadata:
  name: hexapod-controller
  namespace: l2k
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: hexapod-controller}
  template:
    metadata:
      labels: {app: hexapod-controller}
    spec:
      automountServiceAccountToken: false
      nodeSelector: {l2k-pool: services}
      terminationGracePeriodSeconds: 2100
      initContainers:
        - name: node-tools
          image: node:22-slim@sha256:d649c27dae7ba0137b3cef5dd75baa422c08dc3d9e3fc0c23dfb172dc3cc6436
          command: [bash, -ec]
          args:
            - |
              mkdir -p /workspace/.controller-tools/bin
              cp /usr/local/bin/node /workspace/.controller-tools/bin/node
              npm install --prefix /workspace/.controller-tools/claude --no-audit --no-fund @anthropic-ai/claude-code@2.1.226
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: '2', memory: 2Gi}
          volumeMounts:
            - {name: workspace, mountPath: /workspace}
      containers:
        - name: controller
          image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim@sha256:e5b65587bce7de595f299855d7385fe7fca39b8a74baa261ba1b7147afa78e58
          command: [bash, -ec]
          args:
            - |
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y --no-install-recommends ca-certificates curl git tmux procps rsync ffmpeg libegl1 libgl1 libosmesa6 libatomic1 util-linux
              cd /tmp
              curl -fsSL --retry 4 https://dl.k8s.io/release/v1.36.3/bin/linux/amd64/kubectl -o kubectl
              curl -fsSL --retry 4 https://dl.k8s.io/release/v1.36.3/bin/linux/amd64/kubectl.sha256 -o kubectl.sha256
              printf '%s  kubectl\n' "$(cat kubectl.sha256)" | sha256sum --check
              install -m 0755 kubectl /usr/local/bin/kubectl
              exec bash /bootstrap/controller-start.sh
          resources:
            requests: {cpu: '2', memory: 8Gi}
            limits: {cpu: '4', memory: 16Gi}
          startupProbe:
            httpGet: {path: /login, port: 8090}
            periodSeconds: 10
            failureThreshold: 180
          readinessProbe:
            httpGet: {path: /login, port: 8090}
            periodSeconds: 10
          volumeMounts:
            - {name: workspace, mountPath: /workspace}
            - {name: bootstrap, mountPath: /bootstrap}
        - name: tailscale
          image: tailscale/tailscale:v1.104.2@sha256:b11583ad2e93e4671128538c88cf11f460444a5d7e449311dd1933a400ab849d
          command: [tailscaled]
          args:
            - --tun=userspace-networking
            - --state=/var/lib/tailscale/tailscaled.state
            - --socket=/tmp/tailscaled.sock
            - --outbound-http-proxy-listen=127.0.0.1:1055
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 512Mi}
          volumeMounts:
            - {name: workspace, mountPath: /var/lib/tailscale, subPath: .tailscale}
        - name: proxy
          image: caddy:2@sha256:df7f1c2fb114453b951de51a98efc010db1655a92c2e86be6706714e2417a78d
          ports:
            - {name: http, containerPort: 8080}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: '1', memory: 512Mi}
          volumeMounts:
            - {name: bootstrap, mountPath: /etc/caddy/Caddyfile, subPath: Caddyfile}
      volumes:
        - name: workspace
          persistentVolumeClaim: {claimName: controller-workspace}
        - name: bootstrap
          configMap: {name: controller-bootstrap}
---
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: hexapod-controller
  namespace: l2k
spec:
  timeoutSec: 300
  healthCheck:
    type: HTTP
    port: 8080
    requestPath: /__health
---
apiVersion: v1
kind: Service
metadata:
  name: hexapod-controller
  namespace: l2k
  annotations:
    cloud.google.com/neg: '{"ingress":true}'
    cloud.google.com/backend-config: '{"default":"hexapod-controller"}'
spec:
  selector: {app: hexapod-controller}
  ports:
    - {name: http, port: 80, targetPort: 8080}
