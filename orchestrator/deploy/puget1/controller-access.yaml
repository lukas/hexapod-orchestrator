apiVersion: v1
kind: ServiceAccount
metadata:
  name: l2k-controller
  namespace: default
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: l2k-controller
  namespace: default
rules:
  - apiGroups: ['']
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: ['']
    resources: [pods/exec]
    verbs: [get, create]
  - apiGroups: ['']
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: l2k-controller
  namespace: default
subjects:
  - kind: ServiceAccount
    name: l2k-controller
    namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: l2k-controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: l2k-controller-capacity
rules:
  - apiGroups: ['']
    resources: [nodes]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: l2k-controller-capacity
subjects:
  - kind: ServiceAccount
    name: l2k-controller
    namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: l2k-controller-capacity
---
apiVersion: v1
kind: Secret
metadata:
  name: l2k-controller-token
  namespace: default
  annotations:
    kubernetes.io/service-account.name: l2k-controller
type: kubernetes.io/service-account-token
