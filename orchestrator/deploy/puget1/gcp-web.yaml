# Shared by all apps. Per-app deployment files must not overwrite this Ingress.
apiVersion: networking.gke.io/v1beta1
kind: FrontendConfig
metadata:
  name: l2k-web
  namespace: l2k
spec:
  redirectToHttps:
    enabled: true
    responseCodeName: PERMANENT_REDIRECT
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: l2k-web
  namespace: l2k
  annotations:
    kubernetes.io/ingress.class: gce
    kubernetes.io/ingress.global-static-ip-name: l2k-web
    networking.gke.io/managed-certificates: buildviz,rl
    networking.gke.io/v1beta1.FrontendConfig: l2k-web
spec:
  rules:
    - host: buildviz.l2k.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: buildviz, port: {number: 80}}
    - host: rl.l2k.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: hexapod-controller, port: {number: 80}}
