apiVersion: v1
kind: Pod
metadata:
  name: hexapod-mjx-train-puget1
  namespace: default
  labels:
    app: hexapod-training
spec:
  restartPolicy: Always
  automountServiceAccountToken: false
  runtimeClassName: nvidia
  nodeSelector:
    kubernetes.io/hostname: puget1
  containers:
    - name: train
      image: ghcr.io/astral-sh/uv:python3.11-bookworm-slim@sha256:4f5d923c9dcea037f57bda425dd209f3ec643da2f0b74227f68d09dab0b3bb36
      workingDir: /workspace/prototype_sts3215
      command: [/bin/bash, -ec]
      args:
        - |
          rm -f /workspace/prototype_sts3215/.bootstrapped
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y --no-install-recommends libosmesa6 libegl1 libgl1 ffmpeg rsync procps git
          uv sync --frozen --project /workspace/runtime --no-dev
          uv run python -c 'import torch, jax, mujoco, warp, stable_baselines3, sb3_contrib; assert torch.cuda.is_available(); assert any(d.platform == "gpu" for d in jax.devices()); print(torch.cuda.get_device_name(), jax.devices())'
          touch /workspace/prototype_sts3215/.bootstrapped
          exec sleep infinity
      env:
        - name: UV_PROJECT
          value: /workspace/runtime
        - name: UV_PROJECT_ENVIRONMENT
          value: /workspace/runtime/.venv
        - name: UV_PYTHON_DOWNLOADS
          value: never
        - name: UV_NO_SYNC
          value: '1'
        - name: MUJOCO_GL
          value: egl
        - name: XLA_PYTHON_CLIENT_PREALLOCATE
          value: 'false'
      resources:
        requests:
          cpu: '12'
          memory: 24Gi
        limits:
          cpu: '20'
          memory: 48Gi
          nvidia.com/gpu: 1
      readinessProbe:
        exec:
          command: [test, -f, /workspace/prototype_sts3215/.bootstrapped]
        periodSeconds: 10
      volumeMounts:
        - name: workspace
          mountPath: /workspace
        - name: dshm
          mountPath: /dev/shm
  volumes:
    - name: workspace
      hostPath:
        path: /srv/hexapod/worker
        type: Directory
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 4Gi
