# Hard limits for the autonomous experiment orchestrator.
# Puget1 replaces the CoreWeave fleet (operator order 2026-10-21).
# One GPU means one training run; additional work stays in the queue.

compute:
  pods: []
  gpu_pods:
  - hexapod-mjx-train-puget1
  gpu:
    runs_per_pod: 1
    n_envs: 1024
    host_workers: 12
    impl: warp
    defer_final_artifacts: true
    max_steps_per_run: 40000000
    min_eval_every: 1000000
    min_video_every: 2000000
    allow_8way_split: false
  max_runs_per_pod: 1
  max_heavy_per_node: 1
  max_concurrent_runs: 1
  reserved_smoke_slots: 0
  max_steps_per_run: 6000000
  max_decision_cycles_per_day: 196
  kick_overflow_slots: 8
  max_concurrent_cycles: 4
  agent_model_triage: claude-sonnet-5
  agent_model_deep: claude-fable-5
  max_new_launches_per_cycle: 4
  max_new_steps_per_cycle: 16000000
  max_new_gpu_steps_per_cycle: 80000000
  n_envs: 48
  min_eval_every: 200000
  min_video_every: 200000
  log_file_pattern: /tmp/train_<run-name>.log

phases:
  # Experiment phase system (see RESEARCH_RULES.md). Every non-smoke
  # launch declares --phase; the launcher enforces:
  #   canary       <= discovery_max_steps; MECHANISM HEALTH ONLY. A mature
  #                behavior verdict or reward-class closure is invalid.
  #   discovery    <= discovery_max_steps; the question is binary — did
  #                qualitatively correct behavior emerge? Aggressive
  #                early video. 08-21 ruling: a known exploit with
  #                rising reward = MISALIGNED (realign reward with the
  #                eval and relaunch/continue), not a lineage kill.
  #   acquisition  full honest learning budget after a healthy canary;
  #                continuable past the registered budget while reward
  #                and gate metrics rise (08-21 ruling).
  #   hardening / composition / transfer  require --evidence naming
  #                where the correct v2 behavior was already seen (run /
  #                video / canonical trajectory-bank preflight PASS).
  # SPECIFICATION (reward/eval design, preflights, trajectory banks)
  # never trains and has no launch phase.
  discovery_max_steps: 2000000

experiments:
  # Continue-while-improving lineages: mechanically DISABLED (list
  # empty); continuation is a CYCLE decision. Per the operator's 08-21
  # interpretation ruling, bad evals with rising reward mean the cycle
  # continues the run and/or realigns the reward with the evals —
  # judgment picks which, so the mechanical auto-continue stays inert.
  # Re-add a prefix only with an explicit operator directive.
  auto_continue_lineages: []
  # Structured ledger (external review 8b): software-owned facts per run in
  # rl_move/orchestrator/experiments.json — hypothesis+predictions, parent,
  # git SHA, seed, gate, status (INTENT/RUNNING/FINISHED/FAILED), W&B ID,
  # launch-verification results, checkpoint checksum, verdict. RL_LOG.md is
  # narrative on top; the ledger is the record. Dedupe keys on the ledger.
  ledger: rl_move/orchestrator/experiments.json
  # Two-phase launch (external review 8a): write INTENT before launching;
  # mark RUNNING only after mechanically verifying process + advancing log
  # + W&B run/config + no duplicate + pod code at snapshot SHA. The agent
  # is never authoritative about operational state.
  require_mechanical_launch_verification: true
  # ALL training launches (experiments AND smokes) go through
  # rl_move/orchestrator/launch_run.py, which enforces live capacity
  # checks, duplicate/concurrency gates, the ledger, and post-launch
  # verification. Raw `kubectl exec ... nohup train_ppo_sim.py` is a
  # guardrail violation. Use `launch_run.py status` before placing runs.
  require_launcher: true
  # Warm-start from an existing champion unless the log records a reason
  # a fresh init is the hypothesis being tested.
  require_warm_start_default: true
  # Every run needs, in its W&B notes AND the ledger entry: falsifiable
  # hypothesis (prediction-if-true, prediction-if-false, strongest
  # alternative), parent checkpoint, exact gate, code commit. Experiments
  # whose rationale is "try another coefficient" are forbidden (review §0).
  require_hypothesis_and_gate: true
  require_falsifiable_predictions: true
  # Post-launch checkup (operator directive 2026-08-08): ~5 min after every
  # launch, `launch_run.py checkup --run <name>` re-verifies the run.
  # OWNED BY THE WATCHER since 08-08 evening: watch_loop.py runs it
  # asynchronously for every verified launch; DEAD/SUSPECT findings trigger
  # the next cycle and are injected into its prompt. The agent must NOT
  # sleep out the 5 minutes inside a cycle (that serialized every launch
  # into +5 min of wall clock) — verify the launch (two-phase) and exit;
  # act on injected findings FIRST in the cycle that receives them (DEAD ->
  # retry once then escalate; SUSPECT -> read log, kill/rebalance/fix).
  require_post_launch_checkup: true
  checkup_owner: watcher
  checkup_after_s: 300
  # Progress claims must cite metric + named baseline + delta + noise scale.
  # Deltas inside the calibrated eval-noise band are "no evidence of
  # change". Unbacked improvement language is a guardrail violation.
  progress_claims_require_baseline_delta: true
  # REPEALED by operator, 2026-08-15 (relayed via authenticated Cursor
  # session): multi-variable/coupled bundles are permitted when the
  # operator orders them or the cycle judges the coupling necessary;
  # pre-registration and honest verdicts still required. Historical
  # text: "One variable per run wherever possible; twins only with
  # distinct seeds (the model.seed overwrite fix must stay in place)."
  # The seed-overwrite fix and distinct-seed twins requirement stand.
  one_variable_per_run: false
  # Champions are append-only: never overwrite ppo_goal_<name>.zip of a
  # previous run; new runs get new names.
  never_overwrite_checkpoints: true

evaluation:
  # Decisions must be based on the exact-path harness, not W&B curves.
  harness: rl_move/sim/eval_checkpoint.py
  episodes_per_mode: 6
  passes: [deterministic, stochastic]
  eval_at_own_dr: true
  # TRIAGE-FIRST (operator, 2026-08-09: "lightweight review unless
  # there's something real to dig into"). Every verdict still requires
  # eyes on the GATED mode's det frame strip/video — an unwatched
  # success is unverified and cannot support a PASS (a flagged leg
  # shipped inside a 12/12 lower on 2026-08-08). But all-mode det+sto
  # strip review, provenance checksums, and the structured verdict
  # essay apply only on a DIG-IN trigger: gate/video disagreement,
  # metrics anomalous beyond eval noise, protected-skill erosion,
  # canary auto-stop, plan-fork decisions, or reward/env code changes.
  require_video_review: true
  watched_modes: gated_mode_det  # all_verdict_modes on dig-in
  # Root-cause chain (behavior <- incentive <- pricing <- sim/objective
  # defect) is required in the log before any reward/coefficient change;
  # reward patches are last resort with stated justification.
  require_root_cause_chain: true
  # Operator directive 2026-08-08: log entries were too positive about
  # visibly broken motion. Video verdicts must lead with pathologies
  # (flag legs, tripods, dragging, jitter, lurching) and include an
  # explicit "hardware-ready: yes/no" judgment. Scalar gates NEVER
  # override a bad video. Optimistic gloss is a guardrail violation.
  video_verdict_blunt: true
  # Verdict format (external review 8c) — DIG-IN ONLY since 08-09:
  # OBSERVATIONS / INTERPRETATION / VERDICT (+ hardware-ready) /
  # HYPOTHESIS STATUS. Clear pass/fail gets: ledger one-liner via
  # launch_run.py update, 1-2 RL_LOG lines, and a human OUTCOME
  # paragraph appended to the run's W&B notes (ops.sh wandbnote).
  verdict_format_structured: dig_in_only
  require_video_provenance: dig_in_only
  # Every finished run's W&B notes must START with the OUTCOME
  # paragraph (operator, 08-10 — supersedes the 08-09 append-at-bottom
  # rule; ops.sh wandbnote now prepends): what happened + what was
  # learned, plain English for a human. FIRST SENTENCE = the result in
  # plain words. Canonical example (operator-written, cw-uni-rfix-warm1):
  # "Half a win that settles the big question. With the new reward
  # pricing, the robot now SITS DOWN properly every time (6/6 clean,
  # body level, all feet planted) -- the first time the walking-champion
  # brain has learned this. But STANDING UP still fails every time, and
  # the video shows why: [...] Next arm does exactly that. Big picture:
  # keep teaching the walking champion new skills by fine-tuning."
  # Write like that: result -> evidence -> why -> next -> big picture.
  require_wandb_outcome_note: true
  # PLAIN-ENGLISH-FIRST (operator, 08-10, binding): every artifact a
  # human opens cold — W&B notes, ledger hypothesis, RL_LOG entries —
  # must open with one plain sentence stating what is being learned or
  # what happened, BEFORE any lineage/run-name/cfg jargon. The trainers
  # now auto-prepend "WHAT THIS RUN IS TRYING TO LEARN: ..." to W&B
  # notes; hypotheses must do the same by hand. A page the operator
  # cannot parse in 10 seconds is a guardrail violation ("if I can't
  # understand it and an LLM can't understand it, it's not ok").
  plain_english_first: true
  # Gait validity (external review 5b): a walking checkpoint is INVALID if
  # any leg is persistently sacrificed, regardless of velocity error.
  # Flag-leg detection is a permanent eval gate independent of reward terms.
  gait_validity_gate: true

plan:
  # Each cycle reviews RL_PLAN.md against the big goal (fluid real-world
  # motion on the physical hexapod, walking). Revisions allowed, but the
  # plan must not grow: keep it the same length or shorter, archive dead
  # material instead of appending.
  file: RL_PLAN.md
  may_revise: true
  must_not_grow: true

forbidden:
  - >-
    Any contact with the physical robot: no HTTP to 192.168.4.44 /
    hexapod.local, no SSH to the robot, no deploys to linux_control,
    no firmware changes.
  - >-
    Creating, resizing, or deleting pods — EXCEPT the hexapod-mjx-train-N
    pods, which may be deleted/recreated ONLY while idle and ONLY via the
    documented re-slice/scale-out manifests (compute.gpu above,
    CAPACITY.md). The controller (hexapod-sweep-friction) is never
    touched. (The other sweep pods were retired+deleted 2026-08-09.)
  - >-
    Launching training with raw kubectl/nohup instead of
    orchestrator/launch_run.py.
  - >-
    Changing reward/env code without recording the diff rationale in the
    experiment log (code changes ARE allowed - that is the point - but must
    be explained and are snapshotted by tag).
  - >-
    Deleting W&B runs, checkpoints, or git history.
  - >-
    Disabling the PAUSE kill switch, the watcher, or these guardrails.

# OPERATOR CLARIFICATION 2026-09-08: RL_GOALS.md defines two parallel
# physical outcomes: any_means and rl_only (no demonstrations). tracks.json
# maps seven methods to them; method gates are not parent-goal completion.
operator_unblock_policy:
  # ASSUME AND KEEP GOING. No line is ever parked "waiting on the
  # operator" for a design, gate, reward, or tooling question: adopt
  # the best-reasoned answer, record it in OPERATOR_QUESTIONS.md, and
  # keep moving. Wrong-but-recorded beats idle.
  assume_and_go: true
  # Cloud cycles hand physical work to Robot Lab's serialized guarded runner;
  # the forbidden physical-contact rule above still applies to this process.
  # Only concrete hands-on needs and spend approvals wait on the operator.
  # Such waits never block independent work toward either parent outcome.
  operator_only_blockers: [physical-robot, spend-approvals]
  # Keep justified runnable work moving toward both parent outcomes.
  # An empty queue is not permission to invent filler runs: each launch
  # serves a named gap via a registered method, within existing caps.
  # Preserve closed recipes and the run-interpretation requirements;
  # out-of-scope runs are operator-kick only.
  idle_gpu_needs_hard_reason: true
  # Any true wait is written into STATUS.md's WAITING-ON block in the
  # same cycle it starts and removed in the cycle that clears it.
  surface_waits_in_status_top: true
  # A cycle may declare no-op only when nothing agent-doable exists:
  # no untriaged finishes, no named code/tooling items in the track
  # STATUS "Next" lists, no continuation or pre-registered arm with
  # preconditions met. Cycles that execute real work touch
  # rl_move/orchestrator/CYCLE_WORKED so the watcher keeps the fast
  # cadence.
  drain_agent_doable_before_backoff: true

escalation:
  # Escalate (note in STATUS.md WAITING-ON, keep working everything
  # else) ONLY for genuine infra failure or physical/spend items:
  - >-
    Infra failure the cycle cannot repair: pod unreachable, W&B auth
    failing, git push rejected.
  - >-
    Physical robot access or spending beyond these guardrails.
